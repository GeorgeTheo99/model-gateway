schema_version: 1
id: openrouter-gpt
# Part of the curated list: installs with this provider's key get these models automatically.
auto_add: true

provider:
  id: openrouter
  base_url: https://openrouter.ai/api/v1
  protocol: openai
  display_name: OpenRouter
  secret_name: openrouter.api-key

# Zero-data-retention endpoints only (openrouter_zdr). List prices as of
# 2026-10-17; the key check runs a completion on the first (cheapest) model.
models:
  - name: gpt-6-luna-or
    provider: openrouter
    provider_model_id: openai/gpt-6-luna
    display_name: GPT-6 Luna (OpenRouter)
    family: gpt
    base_model: gpt-6-luna
    context: 1050000
    max_output_tokens: 128000
    thinking: optional
    thinking_levels: ["off", low, medium, high, xhigh]
    thinking_format: openrouter
    vision: true
    pricing:
      input: 0.1
      output: 0.5
      cache_read: 0.01
    quirks:
      - openrouter_zdr
    zdr: true
    desc: GPT-6 Luna via OpenRouter, zero-data-retention endpoints only, 1.05M context / 128K max output

  - name: gpt-6.1-sol-or
    provider: openrouter
    provider_model_id: openai/gpt-6.1-sol
    display_name: GPT-6.1 Sol (OpenRouter)
    family: gpt
    base_model: gpt-6.1-sol
    context: 1050000
    max_output_tokens: 128000
    thinking: always
    thinking_levels: [low, medium, high, xhigh]
    thinking_format: openrouter
    vision: true
    pricing:
      input: 2.0
      output: 10.0
      cache_read: 0.1
    quirks:
      - openrouter_zdr
    zdr: true
    desc: GPT-6.1 Sol via OpenRouter, zero-data-retention endpoints only, 1.05M context / 128K max output

  - name: gpt-6-astra-or
    provider: openrouter
    provider_model_id: openai/gpt-6-astra
    display_name: GPT-6 Astra (OpenRouter)
    family: gpt
    base_model: gpt-6-astra
    context: 1050000
    max_output_tokens: 128000
    thinking: always
    thinking_levels: [low, medium, high, xhigh]
    thinking_format: openrouter
    vision: true
    pricing:
      input: 10.0
      output: 50.0
      cache_read: 1.0
    quirks:
      - openrouter_zdr
    zdr: true
    desc: GPT-6 Astra via OpenRouter, zero-data-retention endpoints only, 1.05M context / 128K max output
