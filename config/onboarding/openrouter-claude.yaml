schema_version: 1
id: openrouter-claude
# Part of the curated list: installs with this provider's key get these models automatically.
auto_add: true

provider:
  id: openrouter
  base_url: https://openrouter.ai/api/v1
  protocol: openai
  display_name: OpenRouter
  secret_name: openrouter.api-key

# Zero-data-retention endpoints only (openrouter_zdr). Claude Fable 5.1 has none
# on OpenRouter, so it is offered through Anthropic only. List prices as of
# 2026-10-17; the key check runs a completion on the first (cheapest) model.
models:
  - name: claude-haiku-5.5-or
    provider: openrouter
    provider_model_id: anthropic/claude-haiku-5.5
    display_name: Claude Haiku 5.5 (OpenRouter)
    family: claude
    base_model: claude-haiku-5.5
    context: 1000000
    max_output_tokens: 128000
    thinking: optional
    thinking_levels: ["off", low, medium, high]
    thinking_format: openrouter
    vision: true
    pricing:
      input: 0.1
      output: 0.5
      cache_read: 0.01
      cache_write: 0.125
    quirks:
      - openrouter_zdr
    zdr: true
    desc: Claude Haiku 5.5 via OpenRouter, zero-data-retention endpoints only, 1M context / 128K max output

  - name: claude-sonnet-5.5-or
    provider: openrouter
    provider_model_id: anthropic/claude-sonnet-5.5
    display_name: Claude Sonnet 5.5 (OpenRouter)
    family: claude
    base_model: claude-sonnet-5.5
    context: 1000000
    max_output_tokens: 128000
    thinking: always
    thinking_levels: [low, medium, high, xhigh, max]
    thinking_format: openrouter
    vision: true
    pricing:
      input: 2.0
      output: 10.0
      cache_read: 0.1
      cache_write: 2.5
    quirks:
      - openrouter_zdr
    zdr: true
    desc: Claude Sonnet 5.5 via OpenRouter, zero-data-retention endpoints only, 1M context / 128K max output

  - name: claude-opus-5.5-or
    provider: openrouter
    provider_model_id: anthropic/claude-opus-5.5
    display_name: Claude Opus 5.5 (OpenRouter)
    family: claude
    base_model: claude-opus-5.5
    context: 1000000
    max_output_tokens: 128000
    thinking: always
    thinking_levels: [low, medium, high, xhigh, max]
    thinking_format: openrouter
    vision: true
    pricing:
      input: 4.0
      output: 20.0
      cache_read: 0.2
      cache_write: 5.0
    quirks:
      - openrouter_zdr
    zdr: true
    desc: Claude Opus 5.5 via OpenRouter, zero-data-retention endpoints only, 1M context / 128K max output
