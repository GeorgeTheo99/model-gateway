schema_version: 1
id: zai-glm-5.3

provider:
  id: zai_coding
  base_url: https://api.z.ai/api/coding/paas/v4
  protocol: openai
  secret_name: zai_coding.api-key

models:
  - name: glm-5.3-zai
    provider: zai_coding
    # The current Coding Plan account cannot access the exact glm-5.3 ID yet.
    # Z.ai documents that previous-model requests are automatically routed to
    # GLM-5.3, so retain the advertised glm-5.2 compatibility ID upstream.
    provider_model_id: glm-5.2
    alias: glm53zai
    alternate_ids:
      - glm-5.3
      - glm-5.2-zai
      - glm52zai
    context: 1000000
    max_output_tokens: 131072
    thinking: always
    thinking_levels: [minimal, low, medium, high, xhigh, max]
    thinking_format: zai
    vision: false
    quirks:
      - zai_glm53_thinking
    pi:
      id: glm-5.3
      aliases: [glm52zai]
      thinkingLevelMap:
        "off": low
        minimal: minimal
        low: low
        medium: medium
        high: high
        xhigh: xhigh
        max: max
    desc: GLM 5.3 through Z.ai Coding Plan's documented GLM-5.2 compatibility route; text-only, always-thinking, 1M context / 128K output

retire:
  models:
    - glm-5.2-zai
