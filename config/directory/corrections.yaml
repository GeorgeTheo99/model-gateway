# Gateway-owned facts layered over models.dev (docs/adr/0005-models-dev-directory.md).
# models.dev supplies prices, limits and capabilities; this file supplies what it cannot
# know: provider ids and labels, route names, data-retention routing, request formats and
# quirks, extended cache-write prices and the output caps of the routes we use.
schema_version: 1

# Gateway provider id -> its models.dev provider and how its routes are named and called.
providers:
  anthropic:
    models_dev: anthropic
    display_name: Anthropic
    base_url: https://api.anthropic.com/v1
    protocol: anthropic
    route_suffix: -anthropic
  # The owner's ChatGPT plan (src/chatgpt_auth.py): no key, zero price, Chat Completions only.
  chatgpt:
    models_dev: openai-codex
    display_name: ChatGPT plan
    base_url: https://api.openai.com/v1
    auth: chatgpt
    route_suffix: -chatgpt
  openai:
    models_dev: openai
    display_name: OpenAI
    base_url: https://api.openai.com/v1
    route_suffix: -openai
  google:
    models_dev: google
    display_name: Google
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    route_suffix: -google
  openrouter:
    models_dev: openrouter
    display_name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    route_suffix: -or
    thinking_format: openrouter
    # Zero-data-retention endpoints only, enforced per request (provider.zdr).
    quirks: [openrouter_zdr]
    zdr: true
  fireworks:
    models_dev: fireworks-ai
    display_name: Fireworks
    base_url: https://api.fireworks.ai/inference/v1
    route_suffix: -fw
    # Fireworks serverless keeps no prompts or outputs.
    zdr: true
  moonshot:
    models_dev: moonshotai
    display_name: Moonshot
    base_url: https://api.moonshot.ai/v1
    route_suffix: -moonshot
    thinking_format: kimi
    quirks: [use_max_completion_tokens, drop_fixed_sampling_fields, named_tool_choice_as_required,
             inline_image_urls_only]
  zhipuai:
    models_dev: zhipuai
    display_name: Z.ai
    base_url: https://open.bigmodel.cn/api/paas/v4
    route_suffix: -zai
    thinking_format: zai
  deepseek:
    models_dev: deepseek
    display_name: DeepSeek
    base_url: https://api.deepseek.com/v1
    route_suffix: -deepseek
  xai:
    models_dev: xai
    display_name: xAI
    base_url: https://api.x.ai/v1
    route_suffix: -xai

# Default provider ranking (catalog.provider_preference overrides it): a model is served by the
# first ready provider that offers it. The lab's own API first, with the owner's ChatGPT plan
# ahead of the OpenAI key (owner, 2026-11-19), then Fireworks (open weights, no retention),
# then OpenRouter.
ranking: [anthropic, chatgpt, openai, google, fireworks, moonshot, zhipuai, deepseek, xai, openrouter]

# Lines followed by default: these labs' lines whose current model is under max_age_days old,
# except special-purpose lines (any of exclude_words in the line).
featured:
  labs: [anthropic, openai, google, zhipuai, moonshotai, deepseek, xai]
  max_age_days: 180
  exclude_words: [cyber, rosalind, law, robotics, research, image, tts, live, audio, realtime, search,
                  transcribe, translate, embedding, computer, codex, code, mini, nano, chat, instant, fast,
                  highspeed, build, vision]

# models.dev lab id -> the provider whose routes take the bare base-model name, and the
# catalog family. Gemini is served through OpenRouter's Google Vertex routes, which keep the
# bare names (gemini-4-argon); a direct Google route would be gemini-4-argon-google.
labs:
  anthropic: {home: anthropic, family: claude}
  openai: {home: openai, family: gpt}
  google: {home: openrouter, family: gemini}
  zhipuai: {home: zhipuai, family: glm}
  moonshotai: {home: moonshot, family: kimi}
  deepseek: {home: deepseek, family: deepseek}
  xai: {home: xai, family: grok}

# Applied in order to every model they match; later rules win. Matches: provider (gateway
# id), lab (models.dev lab id), id or id_prefix (models.dev model id on that provider).
rules:
  # Extended cache writes: Anthropic 1-hour writes are 2x input; OpenAI 12-hour writes are
  # 2.5x input for models with a priced 30-minute write. models.dev lists neither.
  - match: {provider: anthropic}
    extended_cache_write: 2.0
  - match: {provider: openrouter, lab: anthropic}
    extended_cache_write: 2.0
  - match: {provider: openai}
    extended_cache_write: 2.5
  # OpenRouter's Google cache_write is not a per-token write rate, and Google Vertex (the
  # zero-retention route) caps output at 64K where models.dev lists AI Studio's limit.
  - match: {provider: openrouter, lab: google}
    drop_pricing: [cache_write]
    max_output_tokens: 65536
  - match: {provider: fireworks, lab: zhipuai}
    set: {thinking_format: openai}
  - match: {provider: fireworks, lab: moonshotai}
    set: {thinking_format: kimi}
  - match: {provider: moonshot}
    extended_cache_write: 2.0
  # The kimi request format cannot turn reasoning off, and K3 takes low/high/max verbatim.
  - match: {lab: moonshotai}
    set: {thinking: always, thinking_levels: [low, high, max]}

  # Established routes keep the names, aliases, labels and limits clients already use.
  - match: {provider: fireworks, id: accounts/fireworks/models/glm-5p3}
    set:
      alias: glm53fw
      alternate_ids: [glm-5.3]
      display_name: GLM 5.3 (Fireworks)
      # models.dev says 1048573; glm-5.3-spot-fw (onboarding) must match it for Open Best's spot tier.
      context: 1048576
      max_output_tokens: 131072
      thinking_levels: [minimal, low, medium, high, xhigh, max]
  - match: {provider: fireworks, id: accounts/fireworks/models/glm-5p3-flash}
    set:
      alias: glm53flashfw
      alternate_ids: [glm-5.3-flash]
      display_name: GLM 5.3 Flash (Fireworks)
      context: 1048576
      max_output_tokens: 131072
      thinking_levels: [minimal, low, medium, high, xhigh, max]
      pi: {aliases: [glm53flash]}
  - match: {provider: fireworks, id: accounts/fireworks/models/kimi-k3}
    route_suffix: ""
    set: {alias: kimi3, max_output_tokens: 131072, pi: {id: kimi-k3}}
  - match: {provider: moonshot, id: kimi-k3.1-pro}
    set: {alias: kimi31, max_output_tokens: 131072, pi: {id: kimi-k3.1-pro}}
  - match: {provider: openrouter, id: z-ai/glm-5.3-flash}
    quirks: [openrouter_fireworks_only]
    set:
      display_name: GLM 5.3 Flash (OpenRouter)
      max_output_tokens: 131072
      thinking_levels: [low, medium, high, xhigh]
  - match: {provider: openrouter, id: google/gemini-4-argon}
    set: {alias: gemini4, thinking_levels: [minimal, low, medium, high, xhigh, max]}
  - match: {provider: openrouter, id: google/gemini-4-carbon}
    set: {alias: gemini}
  - match: {provider: openrouter, id: google/gemini-4-neon}
    set: {alias: gneon}
  - match: {provider: openrouter, id: google/gemini-4-hydrogen}
    set: {alias: ghydrogen}
  # kimi-k3 is the established Fireworks route; Moonshot's own K3 takes a suffix.
  - match: {provider: moonshot, id: kimi-k3}
    set: {name: kimi-k3-moonshot}
