[project]
name = "model-gateway-media-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["media-gen[engines]"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
# media-gen v0.2.0, pinned by commit: a tag can move.
media-gen = { git = "https://github.com/GeorgeTheo99/media-gen", rev = "3616135acc2a0fc584675d4daa9fa1d21de94757" }
# Its LTX-2.5 engine, ltx-2-mlx v0.18.0, is not on PyPI; uv does not inherit media-gen's own sources.
ltx-core-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx", subdirectory = "packages/ltx-core-mlx", rev = "b82b97e3d000e01361f8cfcb745244b15b89a521" }
ltx-pipelines-mlx = { git = "https://github.com/dgrauet/ltx-2-mlx", subdirectory = "packages/ltx-pipelines-mlx", rev = "b82b97e3d000e01361f8cfcb745244b15b89a521" }
