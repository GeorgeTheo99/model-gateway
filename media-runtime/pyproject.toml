[project]
name = "model-gateway-media-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["media-gen[engines]"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
media-gen = { git = "https://github.com/GeorgeTheo99/media-gen", tag = "v0.1.0" }
